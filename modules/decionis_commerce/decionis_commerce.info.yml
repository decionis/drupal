name: 'Decionis Commerce for Drupal Commerce'
type: module
description: 'Checks refunds, prices, promotions, orders and stock with Decionis Commerce, starting in Shadow Mode.'
package: 'Decionis Commerce'
core_version_requirement: ^10.3 || ^11 || ^12
php: 8.1
dependencies:
  - decionis:decionis
  - commerce:commerce_checkout
  - commerce:commerce_order
  - commerce:commerce_payment
  - commerce:commerce_price
  - commerce:commerce_product
  - commerce:commerce_promotion
