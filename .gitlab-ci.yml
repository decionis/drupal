# drupal.org GitLab CI for drupal/decionis, from the Drupal Association templates.
# https://git.drupalcode.org/project/gitlab_templates
include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - "/includes/include.drupalci.main.yml"
      - "/includes/include.drupalci.variables.yml"
      - "/includes/include.drupalci.workflows.yml"

variables:
  # Keep the public matrix on the supported Drupal and Commerce majors.
  OPT_IN_TEST_PREVIOUS_MAJOR: "1"
  _AUTORUN_PREVIOUS_MAJOR: "push-and-mr"
  DECIONIS_TEST_COMMERCE: "^3.3.13"
  # Match the sequential acceptance suite used for the merchant package.
  _PHPUNIT_CONCURRENT: "0"
  _PHPCS_ALLOW_FAILURE: "0"
  _PHPSTAN_ALLOW_FAILURE: "0"
  _CSPELL_DICTIONARY: "Cspell.txt"
  SKIP_ESLINT: "1"
  SKIP_STYLELINT: "1"

# Each GitLab job gets a fresh image; Composer artifacts do not carry PHP
# extensions. The official PHP 8.1 image omits sodium and its source archive.
.decionis-sodium:
  - |
    if ! php -r 'exit(extension_loaded("sodium") ? 0 : 1);'; then
      # Match the running interpreter before compiling its bundled extension.
      test "$(php -r 'echo PHP_VERSION;')" = 8.1.34
      # This image's final security packages moved to Debian's signed archive.
      test "$(sed -n 's/^VERSION_CODENAME=//p' /etc/os-release)" = bullseye
      for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
        if [ -f "$source" ]; then
          sed -i -E 's#https?://(deb\.debian\.org|security\.debian\.org)/debian-security(/|[[:space:]]|$)#https://archive.debian.org/debian-security\2#g' "$source"
        fi
      done
      apt-get update
      apt-get install -y --no-install-recommends $PHPIZE_DEPS libsodium-dev tar xz-utils
      mkdir -p /usr/src
      curl --fail --location --silent --show-error --retry 3 --max-time 120 https://www.php.net/distributions/php-8.1.34.tar.xz -o /usr/src/php.tar.xz
      # PHP.net's published SHA-256, matching the official DrupalCI Dockerfile.
      printf '%s  %s\n' ffa9e0982e82eeaea848f57687b425ed173aa278fe563001310ae2638db5c251 /usr/src/php.tar.xz | sha256sum --check -
      docker-php-ext-configure sodium --with-sodium
      docker-php-ext-install -j2 sodium
    fi
    php --ri sodium
    php -r 'exit(function_exists("sodium_crypto_sign_detached") && function_exists("sodium_crypto_sign_verify_detached") ? 0 : 1);'

# These are test dependencies, added before the template builds its Drupal site.
# Each Commerce variant produces its own vendor tree and Composer lock file.
.composer-base:
  before_script:
    - !reference [.decionis-sodium]
    - composer require --dev --no-update --no-interaction "drupal/commerce:$DECIONIS_TEST_COMMERCE" "drush/drush:^12 || ^13"
    - |
      if [ "$DECIONIS_TEST_COMMERCE" = "^3.3.13" ]; then
        composer require --dev --no-update --no-interaction "drupal/commerce_stock:^3"
      fi

composer:
  variables:
    DRUPAL_CORE: "^11"
    PHP_VERSION: "8.3"
    # Use this matrix row's major, rather than the module's combined range.
    IGNORE_PROJECT_DRUPAL_CORE_VERSION: "1"

composer (previous major):
  variables:
    DRUPAL_CORE: "^10.3"
    PHP_VERSION: "8.1"
    IGNORE_PROJECT_DRUPAL_CORE_VERSION: "1"

composer (commerce 2):
  extends: composer (previous major)
  variables:
    DECIONIS_TEST_COMMERCE: "^2.41"

.phpstan-base:
  before_script:
    - !reference [.decionis-sodium]

phpunit:
  before_script:
    - !reference [.decionis-sodium]
    - export _NODE_VERSION=22.23.2
    - !reference [.check-nvm]
    - |
      # PHPUnit runs as www-data with sudo's system PATH. Expose the pinned
      # Node outside root's NVM directory in this disposable CI container.
      install -m 755 "$(command -v node)" /usr/local/bin/node
      npm install --prefix "$CI_PROJECT_DIR/.decionis-ci/agentsafe" --ignore-scripts --no-audit --no-fund @decionis/agentsafe@0.7.0
      export AGENTSAFE_BIN="$CI_PROJECT_DIR/.decionis-ci/agentsafe/node_modules/.bin/agentsafe"
      test "$(sudo -u www-data -H -E node --version)" = v22.23.2
      sudo -u www-data -H -E "$AGENTSAFE_BIN" --help > /dev/null
      # Preserve the Commerce-only deprecation allowlist used by GitHub CI.
      cat "$CI_PROJECT_DIR/$_WEB_ROOT/core/.deprecation-ignore.txt" "$DRUPAL_PROJECT_FOLDER/tests/deprecation-ignore.txt" > "$CI_PROJECT_DIR/.decionis-ci/deprecation-ignore.txt"
      export SYMFONY_DEPRECATIONS_HELPER="ignoreFile=$CI_PROJECT_DIR/.decionis-ci/deprecation-ignore.txt"
  script:
    # The template reference records EXIT_CODE without exiting, so both the
    # acceptance suite and sandbox determine the job's result.
    - !reference [.phpunit-base-script]
    - |
      phpunitStatus="${EXIT_CODE:-0}"
      sandboxStatus=0
      bash -euo pipefail <<'SANDBOX' || sandboxStatus=$?
      cd "$CI_PROJECT_DIR"
      drush="$COMPOSER_BIN_DIR/drush"
      root="$CI_PROJECT_DIR/$_WEB_ROOT"
      db="$CI_PROJECT_DIR/sandbox.sqlite"
      # Drush 12 and 13 use different forms for an absolute SQLite path.
      if [ "$("$drush" version --field=drush-version | cut -d. -f1)" -ge 13 ]; then
        url="sqlite://localhost/$db"
      else
        url="sqlite://$db"
      fi
      "$drush" --root="$root" site:install minimal --db-url="$url" --yes -q
      "$drush" --root="$root" en commerce_checkout commerce_promotion commerce_payment decionis_commerce -y -q
      # Empty lazy-created tables are harmless; existing non-cache row counts
      # must return to their starting values after the local sandbox.
      count=$(cat <<'PHP'
      $database = \Drupal::database();
      if ($database->databaseType() === 'sqlite') {
        // SQLite findTables() omits main when this fresh site has no prefix.
        if ($database->getPrefix() !== '') {
          throw new \RuntimeException('The SQLite smoke site must not use a table prefix.');
        }
        $tables = $database->query("SELECT name FROM main.sqlite_master WHERE type = 'table' AND substr(name, 1, 7) <> 'sqlite_'")->fetchCol();
      }
      else {
        $tables = $database->schema()->findTables('%');
      }
      if ($tables === []) {
        throw new \RuntimeException('The smoke database has no tables to compare.');
      }
      sort($tables, SORT_STRING);
      $counts = [];
      foreach ($tables as $table) {
        if (!str_starts_with($table, 'cache')) {
          $rowCount = (int) $database->select($table, 't')->countQuery()->execute()->fetchField();
          if ($rowCount > 0) {
            $counts[$table] = $rowCount;
          }
        }
      }
      if ($counts === []) {
        throw new \RuntimeException('The smoke database has no nonempty non-cache tables.');
      }
      foreach (['config', 'users', 'users_field_data'] as $table) {
        if (($counts[$table] ?? 0) < 1) {
          throw new \RuntimeException('The smoke database is missing required core rows.');
        }
      }
      $json = json_encode($counts, JSON_THROW_ON_ERROR);
      echo json_encode(['database_type' => $database->databaseType(), 'non_empty_table_counts' => $counts, 'fingerprint' => hash('sha256', $json)], JSON_THROW_ON_ERROR) . PHP_EOL;
      PHP
      )
      "$drush" --root="$root" php:eval "$count" > SandboxDatabaseBefore.json
      sandboxExit=0
      "$drush" --root="$root" decionis:sandbox --authority=local --json > sandbox-report.json || sandboxExit=$?
      "$drush" --root="$root" php:eval "$count" > SandboxDatabaseAfter.json
      cat sandbox-report.json
      test "$sandboxExit" -eq 0
      php -r '$r = json_decode(file_get_contents("sandbox-report.json"), true, 512, JSON_THROW_ON_ERROR); exit(($r["exit_code"] ?? NULL) === 0 && ($r["verdict"] ?? "") === "BOUNDARY HOLDS" ? 0 : 1);'
      cmp SandboxDatabaseBefore.json SandboxDatabaseAfter.json
      SANDBOX
      if [ "$phpunitStatus" -ne 0 ]; then
        exit "$phpunitStatus"
      fi
      exit "$sandboxStatus"
  artifacts:
    when: always
    paths:
      - junit.xml
      - $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files/simpletest
      - $BROWSERTEST_OUTPUT_DIRECTORY
      - apache.access.log.txt
      - apache.error.log.txt
      - sandbox-report.json
      - SandboxDatabaseBefore.json
      - SandboxDatabaseAfter.json

phpunit (commerce 2):
  extends: phpunit (previous major)
  needs: [composer (commerce 2)]
